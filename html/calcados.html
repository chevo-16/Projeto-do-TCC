<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojas Buenão - Calçados</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/sapatos.css">
</head>
<body>

  <header class="header-sapatos">
    <div class="header-top">
      <div class="left-section">
        <a href="index02.html" class="btn-back" title="Voltar ao início">
          <i class="fa-solid fa-circle-chevron-left"></i>
        </a>
        <div class="logo-container">
          <span class="logo-sub">LOJAS</span>
          <h1 class="logo-main">BUENÃO</h1>
        </div>
      </div>

      <h2 class="category-title">Calçados</h2>

      <div class="right-section">
        <div class="header-icons">
          <a href="./index02.html" title="Início"><i class="fa-solid fa-house"></i></a>
          <a href="./favoritos.html" title="Favoritos"><i class="fa-regular fa-heart"></i></a>
          <a href="./carrinho.html" title="Carrinho"><i class="fa-solid fa-cart-shopping"></i></a>
          <a href="./perfil.html" title="Perfil"><i class="fa-regular fa-user"></i></a>
        </div>
        <button id="btn-open-cat" type="button" class="btn-categorias">
          Categorias
        </button>
      </div>
    </div>

    <div class="filter-pills">
      <button class="pill active" data-filter="todos">Todos</button>
      <button class="pill" data-filter="masculino">Masculino</button>
      <button class="pill" data-filter="feminino">Feminino</button>
      <button class="pill" data-filter="infantil">Infantil</button>
    </div>
  </header>

  <main class="products-section">
    <div class="product-grid" id="sapatos-grid"></div>
  </main>

  <div id="modal-categorias" class="overlay hidden">
    <div class="modal-card">
      <button id="btn-close-cat" type="button" class="close-btn">&times;</button>

      <div class="cat-button cat-feminino" onclick="window.location.href='feminino.html'">
        <span>Feminino</span>
        <div class="icon-circle">
          <img src="../images/roupa-feminina.png" alt="Feminino" />
        </div>
      </div>

      <div class="cat-button cat-masculino" onclick="window.location.href='masculino.html'">
        <span>Masculino</span>
        <div class="icon-circle">
          <img src="../images/roupas-masculinas.png" alt="Masculino" />
        </div>
      </div>

      <div class="cat-button cat-calcados" onclick="window.location.href='calcados.html'">
        <span>Calçados</span>
        <div class="icon-circle">
          <img src="../images/sapato.png" alt="Calçados" />
        </div>
      </div>

      <div class="cat-button cat-infantil" onclick="window.location.href='infantil.html'">
        <span>Infantil</span>
        <div class="icon-circle">
          <img src="../images/infantil.png" alt="Infantil" />
        </div>
      </div>
    </div>
  </div>

  <div id="modal-produto" class="overlay hidden">
    <div class="modal-card modal-produto-card">
      <button id="btn-close-produto" type="button" class="close-btn">&times;</button>
      
      <div class="modal-produto-body">
        <div class="modal-img-container">
          <img id="modal-p-img" src="" alt="Produto" />
        </div>

        <div class="modal-p-detalhes">
          <h2 id="modal-p-nome">Nome do Produto</h2>
          <span id="modal-p-preco" class="modal-p-preco">R$ 0,00</span>

          <div class="secao-opcao">
            <label><strong>Escolha o Tamanho:</strong></label>
            <div id="modal-p-tamanhos" class="tamanhos-grid"></div>
          </div>

          <div class="secao-opcao">
            <label><strong>Quantidade:</strong></label>
            <div class="qtd-selector">
              <button type="button" id="btn-qtd-menos">-</button>
              <span id="modal-p-qtd">1</span>
              <button type="button" id="btn-qtd-mais">+</button>
            </div>
          </div>

          <div class="modal-p-acoes">
            <button type="button" id="btn-confirmar-carrinho" class="btn-carrinho-modal">
              <i class="fa-solid fa-cart-shopping"></i> Adicionar ao Carrinho
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/sapatos.js"></script>
</body>
</html>
