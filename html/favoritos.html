<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lojas Buenão - Meus Favoritos</title>
    <link rel="stylesheet" href="../css/favoritos.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">LOJAS<br />&nbsp;BUENÃO</div>

      <div class="search-box">
        <input type="text" placeholder="Pesquisar favoritos..." />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <div class="header-icons">
        <i class="fa-solid fa-bag-shopping" title="Carrinho" id="icon-carrinho" onclick="window.location.href='carrinho.html'"></i>
        <i class="fa-solid fa-house" title="Início" onclick="window.location.href='index02.html'"></i>
        <i class="fa-solid fa-heart active-icon" title="Favoritos" onclick="window.location.href='favoritos.html'"></i>
        <i class="fa-solid fa-gamepad" title="Desafio Buenão" onclick="window.location.href='game.html'"></i>
        <i class="fa-solid fa-user" title="Perfil" id="icon-perfil" onclick="window.location.href='lg.html'"></i>
      </div>
    </header>

    <div class="divider"></div>

    <section class="products-section">
      <h3 class="section-title">Meus Favoritos ❤️</h3>

      <div id="empty-state" class="empty-state hidden">
        <i class="fa-regular fa-heart"></i>
        <p>Você ainda não favoritou nenhum produto.</p>
        <a href="index02.html" class="btn-voltar">Explorar Produtos</a>
      </div>

      <div id="favoritos-grid" class="product-grid"></div>
    </section>

    <div id="modal-produto" class="overlay hidden">
      <div class="modal-card modal-produto-card">
        <button id="btn-close-produto" type="button" class="close-btn">&times;</button>
        
        <div class="modal-produto-body">
          <div class="modal-img-container">
            <img id="modal-p-img" src="" alt="Produto" />
          </div>

          <div class="modal-p-detalhes">
            <h2 id="modal-p-nome">Nome do Produto</h2>
            <span id="modal-p-preco" class="modal-p-preco">R$ 0,00</span>

            <div class="secao-opcao">
              <label><strong>Escolha o Tamanho:</strong></label>
              <div id="modal-p-tamanhos" class="tamanhos-grid"></div>
            </div>

            <div class="secao-opcao">
              <label><strong>Quantidade:</strong></label>
              <div class="qtd-selector">
                <button type="button" id="btn-qtd-menos">-</button>
                <span id="modal-p-qtd">1</span>
                <button type="button" id="btn-qtd-mais">+</button>
              </div>
            </div>

            <div class="modal-p-acoes">
              <button type="button" id="btn-confirmar-carrinho" class="btn-carrinho-modal">
                <i class="fa-solid fa-cart-shopping"></i> Adicionar ao Carrinho
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/favoritos.js"></script>
  </body>
</html>
