<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lojas Buenão - Principal</title>
    <link rel="stylesheet" href="../css/style02.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">LOJAS<br />&nbsp;BUENÃO</div>

      <div class="search-box">
        <input type="text" placeholder="Pesquisar..." />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <div class="header-icons">
        <i class="fa-solid fa-bag-shopping" title="Carrinho" id="icon-carrinho"></i>
        <i class="fa-solid fa-house" title="Início" onclick="window.location.href='index02.html'"></i>
        <i class="fa-solid fa-heart" title="Favoritos" id="icon-favoritos"></i>
        <i class="fa-solid fa-gamepad" title="Desafio Buenão" onclick="window.location.href='game.html'"></i>
        <i class="fa-solid fa-user" title="Perfil" id="icon-perfil"></i>
      </div>
    </header>

    <div class="nav-container">
      <button id="btn-open-cat" type="button" class="btn-categorias">
        Categorias
      </button>
    </div>

    <div class="divider"></div>

    <section class="hero-section">
      <div class="main-banner">
        <h2>NOVA COLEÇÃO<br />de Inverno 2026</h2>
        <img
          src="../images/nova coleção.png"
          alt="Modelos Inverno"
          class="banner-img"
        />
      </div>

      <div class="side-banners">
        <div id="card-top" class="side-card pink-card">
          <img
            id="side-img-1"
            src="../images/destaque-rosa.png"
            alt="Destaque Superior"
          />
        </div>
        <div id="card-bottom" class="side-card green-card">
          <img
            id="side-img-2"
            src="../images/destaque-verde.png"
            alt="Destaque Inferior"
          />
        </div>
      </div>
    </section>

    <section class="products-section">
      <h3 class="section-title">Mais Vendidos</h3>

      <div class="product-grid">
        
        <div class="product-card" data-id="p1" data-nome="Vestido" data-preco="150" data-img="../images/vestido.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p1', 'Vestido', 150, '../images/vestido.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/vestido.png" alt="Vestido" />
          </div>
          <div class="product-info">
            <span class="p-title">Vestido</span>
            <span class="p-price">R$150</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p1', 'Vestido', 150, '../images/vestido.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p2" data-nome="Tênis" data-preco="200" data-img="../images/tenis.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p2', 'Tênis', 200, '../images/tenis.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/tenis.png" alt="Tênis" />
          </div>
          <div class="product-info">
            <span class="p-title">Tênis</span>
            <span class="p-price">R$200</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p2', 'Tênis', 200, '../images/tenis.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p3" data-nome="Saia" data-preco="80" data-img="../images/saia.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p3', 'Saia', 80, '../images/saia.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/saia.png" alt="Saia" />
          </div>
          <div class="product-info">
            <span class="p-title">Saia</span>
            <span class="p-price">R$80</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p3', 'Saia', 80, '../images/saia.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p4" data-nome="Camiseta" data-preco="100" data-img="../images/camiseta.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p4', 'Camiseta', 100, '../images/camiseta.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/camiseta.png" alt="Camiseta" />
          </div>
          <div class="product-info">
            <span class="p-title">Camiseta</span>
            <span class="p-price">R$100</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p4', 'Camiseta', 100, '../images/camiseta.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p5" data-nome="Jaqueta" data-preco="150" data-img="../images/jaqueta2.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p5', 'Jaqueta', 150, '../images/jaqueta2.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/jaqueta2.png" alt="Jaqueta" />
          </div>
          <div class="product-info">
            <span class="p-title">Jaqueta</span>
            <span class="p-price">R$150</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p5', 'Jaqueta', 150, '../images/jaqueta2.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p6" data-nome="Jaqueta Couro" data-preco="150" data-img="../images/jaqueta1.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p6', 'Jaqueta Couro', 150, '../images/jaqueta1.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/jaqueta1.png" alt="Jaqueta" />
          </div>
          <div class="product-info">
            <span class="p-title">Jaqueta</span>
            <span class="p-price">R$150</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p6', 'Jaqueta Couro', 150, '../images/jaqueta1.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p7" data-nome="Calça" data-preco="150" data-img="../images/calça.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p7', 'Calça', 150, '../images/calça.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/calça.png" alt="Calça" />
          </div>
          <div class="product-info">
            <span class="p-title">Calça</span>
            <span class="p-price">R$150</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p7', 'Calça', 150, '../images/calça.png')">
            Adicionar ao Carrinho
          </button>
        </div>

        <div class="product-card" data-id="p8" data-nome="Tênis Urbano" data-preco="200" data-img="../images/tenis2.png">
          <button type="button" class="btn-favorito" onclick="alternarFavorito('p8', 'Tênis Urbano', 200, '../images/tenis2.png')">
            <i class="fa-regular fa-heart"></i>
          </button>
          <div class="img-container">
            <img src="../images/tenis2.png" alt="Tênis" />
          </div>
          <div class="product-info">
            <span class="p-title">Tênis</span>
            <span class="p-price">R$200</span>
          </div>
          <button type="button" class="btn-add-carrinho" onclick="adicionarAoCarrinho('p8', 'Tênis Urbano', 200, '../images/tenis2.png')">
            Adicionar ao Carrinho
          </button>
        </div>

      </div>
    </section>

    <!-- Modal de Categorias -->
    <div id="modal-categorias" class="overlay hidden">
      <div class="modal-card">
        <button id="btn-close-cat" type="button" class="close-btn">
          &times;
        </button>

        <div class="cat-button cat-feminino" data-categoria="feminino">
          <span>Feminino</span>
          <div class="icon-circle">
            <img src="../images/roupa-feminina.png" alt="Feminino" />
          </div>
        </div>

        <div class="cat-button cat-masculino" data-categoria="masculino">
          <span>Masculino</span>
          <div class="icon-circle">
            <img src="../images/roupas-masculinas.png" alt="Masculino" />
          </div>
        </div>

        <div class="cat-button cat-calcados" data-categoria="calcados">
          <span>Calçados</span>
          <div class="icon-circle">
            <img src="../images/sapato.png" alt="Calçados" />
          </div>
        </div>

        <div class="cat-button cat-infantil" data-categoria="infantil">
          <span>Infantil</span>
          <div class="icon-circle">
            <img src="../images/infantil.png" alt="Infantil" />
          </div>
        </div>
      </div>
    </div>

    <!-- Script com type="module" -->
    <script type="module" src="../js/script02.js"></script>
  </body>
</html>
