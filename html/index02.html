<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lojas Buenão - Principal</title>
    <link rel="stylesheet" href="../css/style02.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">LOJAS<br />BUENÃO</div>

      <div class="search-box">
        <input type="text" placeholder="Pesquisar..." />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="header-icons">
        <i class="fa-solid fa-bag-shopping" title="Carrinho" id="icon-carrinho" onclick="window.location.href='carrinho.html'"></i>
        <i class="fa-solid fa-house" title="Início" onclick="window.location.href='index02.html'"></i>
        <i class="fa-solid fa-heart" title="Favoritos" id="icon-favoritos" onclick="window.location.href='favoritos.html'"></i>
        <i class="fa-solid fa-gamepad" title="Desafio Buenão" onclick="window.location.href='game.html'"></i>
        <i class="fa-solid fa-user" title="Perfil" id="icon-perfil" onclick="window.location.href='perfil.html'"></i>
      </div>
    </header>

    <div class="nav-container">
      <button id="btn-open-cat" type="button" class="btn-categorias">
        Categorias
      </button>
    </div>

    <div class="divider"></div>

    <section class="hero-section">
      <div class="main-banner">
        <h2>NOVA COLEÇÃO<br />de Inverno 2026</h2>
        <img
          src="../images/nova coleção.png"
          alt="Modelos Inverno"
          class="banner-img"
        />
      </div>

      <div class="side-banners">
        <div id="card-top" class="side-card pink-card">
          <img
            id="side-img-1"
            src="../images/destaque-rosa.png"
            alt="Destaque Superior"
          />
        </div>
        <div id="card-bottom" class="side-card green-card">
          <img
            id="side-img-2"
            src="../images/destaque-verde.png"
            alt="Destaque Inferior"
          />
        </div>
      </div>
    </section>

    <section class="products-section">
      <h3 class="section-title">Mais Vendidos</h3>

      <div class="product-grid" id="main-product-grid"></div>
    </section>

    <div id="modal-categorias" class="overlay hidden">
      <div class="modal-card">
        <button id="btn-close-cat" type="button" class="close-btn">×</button>

        <div class="cat-button cat-feminino" onclick="window.location.href='feminino.html'">
          <span>Feminino</span>
          <div class="icon-circle">
            <img src="../images/roupa-feminina.png" alt="Feminino" />
          </div>
        </div>

        <div class="cat-button cat-masculino" onclick="window.location.href='masculino.html'">
          <span>Masculino</span>
          <div class="icon-circle">
            <img src="../images/roupas-masculinas.png" alt="Masculino" />
          </div>
        </div>

        <div class="cat-button cat-calcados" onclick="window.location.href='sapatos.html'">
          <span>Calçados</span>
          <div class="icon-circle">
            <img src="../images/sapato.png" alt="Calçados" />
          </div>
        </div>

        <div class="cat-button cat-infantil" onclick="window.location.href='infantil.html'">
          <span>Infantil</span>
          <div class="icon-circle">
            <img src="../images/infantil.png" alt="Infantil" />
          </div>
        </div>
      </div>
    </div>

    <div id="modal-produto" class="overlay hidden">
      <div class="modal-card modal-produto-card">
        <button id="btn-close-produto" type="button" class="close-btn"></button>
        
        <div class="modal-produto-body">
          <div class="modal-img-container">
            <img id="modal-p-img" src="" alt="Produto" />
          </div>

          <div class="modal-p-detalhes">
            <h2 id="modal-p-nome">Nome do Produto</h2>
            <span id="modal-p-preco" class="modal-p-preco">R$0,00</span>

            <div class="secao-opcao">
              <label><strong>Escolha o Tamanho:</strong></label>
              <div id="modal-p-tamanhos" class="tamanhos-grid"></div>
            </div>

            <div class="secao-opcao">
              <label><strong>Quantidade:</strong></label>
              <div class="qtd-selector">
                <button type="button" id="btn-qtd-menos">-</button>
                <span id="modal-p-qtd">1</span>
                <button type="button" id="btn-qtd-mais">+</button>
              </div>
            </div>

            <div class="modal-p-acoes">
              <button type="button" id="btn-confirmar-carrinho" class="btn-carrinho-modal">
                <i class="fa-solid fa-cart-shopping"></i> Adicionar ao Carrinho
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/script02.js"></script>
  </body>
</html>
