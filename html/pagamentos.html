<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buenão - Formas de Pagamento</title>
  <link rel="stylesheet" href="../css/pagamentos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="pagamentos-container">
    <div class="header-pagamentos">
      <button class="btn-voltar" onclick="window.location.href='perfil.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2>Formas de Pagamento</h2>
    </div>

    <div class="secao-metodos">
      <h3>Métodos Disponíveis</h3>
      
      <div class="metodo-item">
        <div class="metodo-info">
          <i class="fa-brands fa-pix icone-pix"></i>
          <div>
            <strong>Pix</strong>
            <p>Aprovação imediata</p>
          </div>
        </div>
        <span class="badge-ativo">Ativo</span>
      </div>

      <div class="metodo-item">
        <div class="metodo-info">
          <i class="fa-solid fa-barcode icone-boleto"></i>
          <div>
            <strong>Boleto Bancário</strong>
            <p>Vencimento em 3 dias úteis</p>
          </div>
        </div>
        <span class="badge-ativo">Ativo</span>
      </div>
    </div>

    <div class="secao-cartoes">
      <div class="secao-topo">
        <h3>Meus Cartões</h3>
        <button class="btn-add-cartao" id="btn-abrir-cartao">
          <i class="fa-solid fa-plus"></i> Cartão
        </button>
      </div>

      <div id="container-form-cartao" class="card-form hidden">
        <h4>Cadastrar Cartão</h4>
        <form id="form-cartao">
          <div class="input-group">
            <label for="numero-cartao">Número do Cartão</label>

              <input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" maxlength="19" required />
          </div>

          <div class="input-group">
            <label for="nome-cartao">Nome Impresso no Cartão</label>
            <input type="text" id="nome-cartao" placeholder="NOME COMO NO CARTÃO" required />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="validade-cartao">Validade</label>
              <input type="text" id="validade-cartao" placeholder="MM/AA" maxlength="5" required />
            </div>
            <div class="input-group">
              <label for="cvv-cartao">CVV</label>
              <input type="text" id="cvv-cartao" placeholder="123" maxlength="4" required />
            </div>
          </div>

          <div class="form-acoes">
            <button type="button" class="btn-cancelar" id="btn-fechar-cartao">Cancelar</button>
            <button type="submit" class="btn-salvar">Salvar Cartão</button>
          </div>
        </form>
      </div>

      <div id="lista-cartoes" class="lista-cartoes">
        <p class="carregando">Carregando cartões...</p>
      </div>
    </div>

  </div>

  <script type="module" src="../js/pagamentos.js"></script>
</body>
</html>
